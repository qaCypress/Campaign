<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редірект на іншу сторінку</title>
    <script type="text/javascript">
        // Виконуємо редірект на іншу сторінку через 3 секунди
        window.onload = function() {
            setTimeout(function() {
                window.location.href = "https://checkqa.vercel.app/check-campaign";  // Заміни на потрібну URL
            }, 300); // Затримка в 3 секунди
        };
    </script>
</head>
<body>
    <h1>Ви будете перенаправлені на нову сторінку...</h1>
</body>
</html>
